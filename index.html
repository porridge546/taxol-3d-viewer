<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>紫杉醇 3D 分子模型 · 交互查看器</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <header class="panel top">
      <h1>紫杉醇 · 3D 分子模型交互器</h1>
      <p class="sub">Paclitaxel (Taxol) · C₄₇H₅₁NO₁₄ · MMFF 优化构象 · CPK 配色</p>
      <nav class="tabs">
        <button class="tab active" data-style="spacefill">空间填充</button>
        <button class="tab" data-style="ballstick">球棍模型</button>
        <button class="tab" data-style="sticks">棍状模型</button>
      </nav>
    </header>

    <aside class="panel left">
      <h2>图例</h2>
      <ul id="legend"></ul>
      <label class="check" id="hRow">
        <input type="checkbox" id="toggleH" checked /> 显示氢原子（<span id="hCount"></span> 个）
      </label>

      <h2>外观调节</h2>
      <div class="slider-row" id="rowSphere">
        <label>球体大小 <span class="val" id="vSphere">1.00</span></label>
        <input type="range" id="sSphere" min="0.4" max="1.6" step="0.05" value="1" />
      </div>
      <div class="slider-row" id="rowStick">
        <label>棍子粗细 <span class="val" id="vStick">1.0</span></label>
        <input type="range" id="sStick" min="0.4" max="3" step="0.1" value="1" />
      </div>
      <div class="slider-row" id="rowGap">
        <label>球棍间距 <span class="val" id="vGap">0.15 Å</span></label>
        <input type="range" id="sGap" min="0" max="0.8" step="0.02" value="0.15" />
      </div>
    </aside>

    <aside class="panel right" id="inspector">
      <h2>颜色编辑</h2>
      <div id="selInfo" class="sel-info">点击球体或棍子进行选择（可点选多个）</div>
      <div class="picker-row" id="pickerRow" style="display:none">
        <input type="color" id="colorPicker" value="#8c8c8c" />
        <button id="resetSel" class="btn ghost small">恢复选中项</button>
      </div>
      <button id="resetAll" class="btn ghost" style="margin-top:12px">全部恢复默认颜色</button>
      <p class="hint">左键拖动旋转 · 滚轮缩放 · 右键平移<br />点击物体加入/移出选择 · 点击空白处清空选择</p>
    </aside>

    <footer class="panel bottom" id="stats"></footer>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
